<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#101813;color:#e9eddf;font-family:Arial,'Malgun Gothic',sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 42%,#34513755,transparent 55%)}.wrap{max-width:1320px;margin:auto;padding:0 7vw}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20}.brand{font-size:19px;font-weight:800;letter-spacing:-.8px}.brand span{color:#b9db73}.status{font-size:11px;letter-spacing:2px;color:#a8b5a4}.status:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#b9db73;margin-right:10px}main{position:relative;min-height:calc(100svh - 175px);display:flex;align-items:center;padding:70px 0 100px;overflow:hidden}.content{z-index:1;position:relative}.eyebrow{color:#b9db73;font-size:11px;letter-spacing:3px;margin-bottom:32px}h1{font-size:clamp(78px,12vw,170px);line-height:.86;letter-spacing:-.075em;margin:0 0 35px;font-weight:800}h1 span{display:block;color:#b9db73}p{font-size:16px;line-height:1.9;color:#aeb9aa;margin:0 0 32px}.link{display:inline-flex;align-items:center;gap:40px;background:#b9db73;color:#101813;padding:17px 23px;text-decoration:none;font-size:13px;font-weight:bold;border-radius:3px}.link:hover{background:#d1ee9d}.orb{position:absolute;width:clamp(260px,40vw,520px);aspect-ratio:1;right:-3%;top:48%;transform:translateY(-50%) rotate(-22deg);border-radius:50%;border:1px solid #b9db7335;box-shadow:inset 30px 0 80px #b9db7312,0 0 100px #b9db7308}.orb:before,.orb:after{content:'';position:absolute;inset:10%;border:1px solid #b9db7340;border-radius:50%;transform:rotate(35deg) scaleX(.45)}.orb:after{inset:24% -5%;transform:rotate(-10deg);border-color:#b9db7350}.note{font-size:11px;letter-spacing:2px;color:#7c8c77;margin-top:55px}footer{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid #ffffff20;color:#7c8c77;font-size:11px;letter-spacing:1px}a:focus-visible{outline:3px solid white;outline-offset:5px}@media(max-width:650px){header{height:80px}.status{letter-spacing:1px;font-size:9px}main{min-height:calc(100svh - 160px);padding:75px 0}.orb{right:-150px;opacity:.5}p{font-size:14px}footer{flex-wrap:wrap;padding:22px 0;line-height:1.6}h1{font-size:94px}.eyebrow{font-size:10px}}
